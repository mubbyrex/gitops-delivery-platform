# Deliberately not part of either service's own chart, which is where that
# service's scrape definition lives. The two objects are scoped differently and
# docs/decisions.md says why; the consequence is one release, into the namespace
# the collector lives in.

# The label the dashboard sidecar looks for. Set here rather than inline so
# that the coupling to the metrics chart is visible in one place.
sidecarLabel: grafana_dashboard

# Which environments the views offer in their namespace selector.
environments:
  - dev
  - staging
