# Defaults only. Editing this file changes how the image runs, not what is in
# it, so it does not rebuild or republish anything. Every environment overrides what it needs in
# environments/<env>/payments-api.yaml, and nothing that differs between
# environments belongs here.

# How many copies serve traffic. This value existing at all is what makes this
# service the shape it is: more copies means more capacity, and two versions
# can serve side by side while traffic is shifted between them. The other
# service in this platform has no equivalent, deliberately.
replicaCount: 1

image:
  repository: ghcr.io/mubbyrex/gitops-delivery-platform/payments-api
  # Identified by content, never by a tag. A tag can be moved to different
  # bytes later, which would mean the running version is not determined by what
  # is committed. There is deliberately no tag field to fall back to: a
  # reference carrying both is either ambiguous or silently ignores one.
  #
  # No default, so that a missing digest fails loudly at render rather than
  # quietly running whatever was here last.
  digest: ""
  pullPolicy: IfNotPresent

# Written into the version label on build-info metrics, so that two versions
# running at once are distinguishable while traffic is split between them.
version: "unspecified"

service:
  port: 80
  targetPort: 8080

# The failure switch, in two halves because the halves fail differently.
# Liveness failing means the process is broken and should be restarted.
# Readiness failing means this copy is running but should not receive traffic.
# Confusing the two is how a release that should degrade gracefully instead
# takes out every copy at once.
failure:
  liveness: false
  readiness: false

# How long after start the service reports itself ready. Zero is honest for a
# stub that has nothing to warm up; a non-zero value gives a rollout something
# to wait for.
readyAfterSeconds: 0

# Small, because the node pool is shared and a stub that reserves what a real
# service would reserve would crowd out the things this platform exists to
# demonstrate.
resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 96Mi

probes:
  liveness:
    initialDelaySeconds: 3
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 2
    periodSeconds: 5
    failureThreshold: 3

# How this service is published, and which gateway publishes it.
#
# The gateway is shared by every environment and lives outside them, so these
# three values are the same everywhere and belong here rather than in an
# environment file. The host name is not: it is what keeps two environments
# from claiming the same path on one gateway, so it differs by definition and
# has no default.
route:
  gateway:
    name: traefik-gateway
    namespace: traefik
    listener: web
  hostname: ""

# The release schedule: how much traffic an unproven version gets, and for how
# long, before it gets more. Every number below is derived rather than chosen;
# the derivations are in docs/decisions.md.
canary:
  # Seven times the seventeen seconds the readiness probe takes to declare
  # failure -- enough for an image pull onto a cold node and little else.
  progressDeadlineSeconds: 120
  # The default reports the deadline without acting, which leaves a dead
  # replica set holding a pod slot until a person intervenes.
  progressDeadlineAbort: true

  steps:
    # Set by the sample size, not by the exposure: ten percent is the
    # smallest first step whose measurement window still holds enough
    # requests to tell a failure from silence. Below a certain weight a
    # smaller first step makes a release less safe, which is the
    # counter-intuitive part and is worked through in docs/architecture.md.
    - setWeight: 10
    # Six scrapes at the collector's thirty-second interval. A longer pause
    # costs release time but not exposure: how fast a bad version is
    # abandoned is set by the gate's interval and tolerance, not by this.
    - pause:
        duration: 3m
    # Each step roughly triples, then doubles -- the evidence behind the bet
    # grows with every step that passes.
    - setWeight: 30
    - pause:
        duration: 3m
    - setWeight: 60
    - pause:
        duration: 3m

# The release gate. What is measured while the weights above are in force, and
# what result abandons the release. The queries are in the template beside this
# chart's other files; only the numbers are here.
gate:
  # Where to ask. The collector installed two phases ago, addressed by service
  # rather than by address, so it survives being rescheduled.
  collector: http://metrics-kube-prometheus-st-prometheus.metrics.svc.cluster.local:9090

  # How often a measurement is taken. One per scrape: asking more often than
  # the data changes only re-reads the same samples and makes a transient look
  # like several independent observations.
  interval: 30s

  # How far back each query looks. Six scrapes.
  window: 2m

  # Nothing is measured for the first minute after traffic arrives. Without
  # this the gate withdraws healthy releases, because a rate read before its
  # window has filled describes the window rather than the service. Do not
  # lower it without reading docs/decisions.md.
  initialDelay: 1m

  # Three failures at thirty-second intervals, so a candidate has to look
  # wrong for about ninety seconds. This is where the tolerance for a
  # transient lives, rather than in a looser threshold below.
  failureLimit: 2

  # A fifth of what the smallest step should produce. This is the measurement
  # that catches what the other two cannot: a candidate that never becomes
  # ready serves nothing, fails nothing, and would otherwise be promoted on a
  # perfect record. Removing it is the single most damaging edit in this file.
  minRequestsPerSecond: "0.1"

  # One percent, and the precision is partly a fiction: at this traffic rate
  # a single failed request is 1.7 percent of the window, so in practice any
  # failure is a breach and the tolerance sits in failureLimit above.
  maxErrorShare: "0.01"

  # Ninety-fifth percentile request duration. Nearly blind, and kept anyway:
  # every observation so far has landed in the histogram's smallest bucket, so
  # this can only catch a regression of roughly five hundred times and cannot
  # see a service that became ten times slower. The limit is in the bucket
  # boundaries rather than in this number -- read docs/decisions.md before
  # changing either.
  maxLatencySeconds: "0.01"
