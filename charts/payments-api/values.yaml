# Defaults only. Editing this file changes how the image runs, not what is in
# it, so it does not rebuild or republish anything. Every environment overrides what it needs in
# environments/<env>/payments-api.yaml, and nothing that differs between
# environments belongs here.

# How many copies serve traffic. This value existing at all is what makes this
# service the shape it is: more copies means more capacity, and two versions
# can serve side by side while traffic is shifted between them. The other
# service in this platform has no equivalent, deliberately.
replicaCount: 1

image:
  repository: ghcr.io/mubbyrex/gitops-delivery-platform/payments-api
  # Identified by content, never by a tag. A tag can be moved to different
  # bytes later, which would mean the running version is not determined by what
  # is committed. There is deliberately no tag field to fall back to: a
  # reference carrying both is either ambiguous or silently ignores one.
  #
  # No default, so that a missing digest fails loudly at render rather than
  # quietly running whatever was here last.
  digest: ""
  pullPolicy: IfNotPresent

# Written into the version label on build-info metrics, so that two versions
# running at once are distinguishable while traffic is split between them.
version: "unspecified"

service:
  port: 80
  targetPort: 8080

# The failure switch, in two halves because the halves fail differently.
# Liveness failing means the process is broken and should be restarted.
# Readiness failing means this copy is running but should not receive traffic.
# Confusing the two is how a release that should degrade gracefully instead
# takes out every copy at once.
failure:
  liveness: false
  readiness: false

# How long after start the service reports itself ready. Zero is honest for a
# stub that has nothing to warm up; a non-zero value gives a rollout something
# to wait for.
readyAfterSeconds: 0

# Small, because the node pool is shared and a stub that reserves what a real
# service would reserve would crowd out the things this platform exists to
# demonstrate.
resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 96Mi

probes:
  liveness:
    initialDelaySeconds: 3
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 2
    periodSeconds: 5
    failureThreshold: 3

# How this service is published, and which gateway publishes it.
#
# The gateway is shared by every environment and lives outside them, so these
# three values are the same everywhere and belong here rather than in an
# environment file. The host name is not: it is what keeps two environments
# from claiming the same path on one gateway, so it differs by definition and
# has no default.
route:
  gateway:
    name: traefik-gateway
    namespace: traefik
    listener: web
  hostname: ""

# The release schedule: how much traffic an unproven version gets, and for how
# long, before it gets more.
#
# Empty on purpose, and not for long. With nothing here a release still runs
# through the controller and still moves traffic by weight; it simply never
# stops anywhere, so there is no point at which anything could be measured and
# no point at which anything could be withdrawn. That is the plain case, and it
# is worth having working on its own before anything is added to interrupt it.
#
# A fifty percent first step with an indefinite pause stood here while the
# weighting mechanism was being proved. It was a probe and it was removed: a
# number that exists to make a demonstration visible is not a number anybody
# chose, and leaving it would have meant the schedule was decided by whatever
# was convenient to watch.
canary:
  # How long a release may make no progress before it is given up on, and
  # whether giving up actually does anything. Both measured against a release
  # that needed them rather than left at defaults — see the rollout template.
  #
  # Seventeen seconds is when the readiness probe declares failure. Two
  # minutes is seven times that, which covers an image pull onto a cold node
  # and little else. The default of ten minutes is thirty-five times the
  # evidence.
  progressDeadlineSeconds: 120
  # The default reports the deadline and takes no action, which leaves a
  # replica set that will never work holding a pod slot until a person
  # intervenes. A release that needs a human to finish failing is not a
  # release that withdraws itself.
  progressDeadlineAbort: true

  steps:
    # Ten percent first, and the reason is the measurement rather than the
    # exposure. At the measured traffic of 4.87 requests a second, ten percent
    # sends the candidate about half a request a second — roughly 58 requests
    # in a measurement window. That is the smallest sample a failure can still
    # be distinguished from silence in. At five percent the window holds 29
    # requests and a single failure is 3.4 percent of the sample, so the
    # measurement becomes coarser than any threshold worth setting, and a
    # failing version is more likely to clear the first gate and be promoted
    # to a weight where it does more harm. Below a certain weight, a smaller
    # first step makes the release less safe.
    - setWeight: 10
    # Three minutes, which is six scrapes at the collector's thirty-second
    # interval. Two minutes gives four samples and one minute gives two, and a
    # rate computed from two samples is a difference rather than a rate. A
    # longer pause costs release time but not exposure to a bad version:
    # how quickly a release is abandoned is set by the gate's own interval and
    # tolerance, not by how long a passing step waits.
    - pause:
        duration: 3m
    # Each step roughly triples, then doubles. The size of a step is a bet,
    # and the evidence behind it grows with every step that passes: three
    # clean minutes at ten percent is around 880 observed requests, so
    # widening to thirty risks three times the traffic on far more evidence.
    - setWeight: 30
    - pause:
        duration: 3m
    - setWeight: 60
    - pause:
        duration: 3m

# The release gate. What is measured while the weights above are in force, and
# what result abandons the release. The queries are in the template beside this
# chart's other files; only the numbers are here.
gate:
  # Where to ask. The collector installed two phases ago, addressed by service
  # rather than by address, so it survives being rescheduled.
  collector: http://metrics-kube-prometheus-st-prometheus.metrics.svc.cluster.local:9090

  # How often a measurement is taken. One per scrape: asking more often than
  # the data changes only re-reads the same samples and makes a transient look
  # like several independent observations.
  interval: 30s

  # How far back each query looks. Six scrapes.
  window: 2m

  # How long to wait after traffic first reaches the candidate before taking
  # the first measurement.
  #
  # Without this the gate fails a healthy release. A rate computed over a
  # two-minute window twenty seconds after traffic started describes the
  # window, not the service: the arithmetic reads 0.061 requests a second
  # against a floor of 0.1, and a correct candidate is marked absent. At sixty
  # seconds it reads 0.243, two and a half times the floor.
  #
  # The other two measurements need it for a harder reason. A quantile over a
  # window with no observations in it returns nothing at all, and nothing is
  # not a number the gate can compare — it is reported as the query having
  # failed rather than the candidate having failed, which is a different
  # thing with a different tolerance.
  #
  # This is the same principle as the three-minute step: a measurement is only
  # worth taking once there is enough in the window to measure.
  initialDelay: 1m

  # How many failed measurements are tolerated before the release is
  # abandoned. Three failures at thirty-second intervals means a candidate has
  # to look wrong for about ninety seconds, which is where the tolerance for a
  # transient lives — see the note on the error share below.
  failureLimit: 2

  # The candidate must be serving at least this many requests a second.
  #
  # A fifth of the half-request-a-second the smallest step should produce. This
  # is the measurement that catches the failure the others cannot see: a
  # candidate that never becomes ready serves nothing, fails nothing, and would
  # otherwise be promoted on a perfect record.
  #
  # Too high, near the expected value, and ordinary variation aborts good
  # releases. Too low or absent, and a dead version passes every gate.
  minRequestsPerSecond: "0.1"

  # The share of real requests the candidate may fail.
  #
  # The precision here is partly a fiction and that is worth knowing. At 58
  # requests in a window, one failure is 1.7 percent — there is no sample in
  # which this can read one percent. In practice it means any failed request is
  # a breach, and the tolerance for a blip lives in failureLimit above rather
  # than in a looser percentage. A service with real traffic would make this a
  # genuine proportion and could afford a smaller tolerance.
  #
  # Too strict and every blip aborts a good release, which is its own outage:
  # the fix for an incident is also a release. Too loose — five percent, say —
  # and at this volume a version failing one request in twenty could promote.
  maxErrorShare: "0.01"

  # Ninety-fifth percentile request duration. Nearly blind, and kept anyway:
  # every observation so far has landed in the histogram's smallest bucket, so
  # this can only catch a regression of roughly five hundred times and cannot
  # see a service that became ten times slower. The limit is in the bucket
  # boundaries rather than in this number -- read docs/decisions.md before
  # changing either.
  maxLatencySeconds: "0.01"
