{{- /*
Three addresses, each with one job. The other chart in this platform has none
at all, because a scheduled job is not something anything connects to — which
is one of the places the two shapes differ.

The first selects every copy of this service regardless of version, and exists
to be scraped. The other two select one version each and exist to be routed
to. Keeping them apart is what stops a release from corrupting its own
measurements: if the thing being scraped were pinned to one version, half the
traffic during a release would be invisible, and if the scrape target were
duplicated per version, every request would be counted twice while the two
addresses pointed at the same pods.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: payments-api
  labels:
    app.kubernetes.io/name: payments-api
    # What this address selects, not what it is for. The scrape definition
    # matches on this rather than on the name label, because all three of
    # these services carry the name and matching on it would scrape every pod
    # once per service — three times over, and three times again for every
    # rate computed from the result.
    kestrel-pay.io/role: all-versions
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: payments-api
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http

---
{{- /*
The version traffic is on now, and the version being tried. Both are defined
here with the ordinary selector and neither keeps it: the release controller
rewrites each one to pin it to a single replica set, so these two selectors are
the only place in this chart where what is committed is deliberately not what
ends up running. That is the controller's job, not drift, and the application
that deploys this chart has to be told the difference.

At rest both resolve to the same pods, because the version that was tried last
is the version now trusted. They only diverge while a release is in progress.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: payments-api-stable
  labels:
    app.kubernetes.io/name: payments-api
    kestrel-pay.io/role: stable
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: payments-api
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: payments-api-canary
  labels:
    app.kubernetes.io/name: payments-api
    kestrel-pay.io/role: canary
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: payments-api
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
