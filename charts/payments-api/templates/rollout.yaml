{{- /*
A Rollout rather than a Deployment, because this service is long-running,
scales by replica count, and can therefore have two versions serving at once
while traffic is moved between them. That is the whole difference between this
chart and the other one, and it is meant to be visible from the shape of the
file: there is a replica count here, a weighted step schedule, and two probes,
and none of those make sense for a job that runs on a schedule.

The other chart in this platform deliberately has no equivalent of this file.
Two versions of a settlement run overlapping is the hazard this whole platform
exists to prevent, and overlapping two versions is precisely what the strategy
below does on purpose.

A Rollout replaces the Deployment rather than sitting beside it. The controller
creates and scales the replica sets itself, so a Deployment left in place would
be a second thing managing the same pods.
*/}}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: payments-api
  labels:
    app.kubernetes.io/name: payments-api
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app.kubernetes.io/name: payments-api

  {{- /*
  How long a release may make no progress before it is abandoned, and whether
  being abandoned means anything.

  Both of these were left at their defaults until a release was run that
  needed them, and the run is what showed the defaults were wrong here.

  A version whose readiness check fails never becomes ready, so the controller
  never moves any traffic to it and the release stops at the first step. No
  user is affected — the weights never leave the trusted version, and every
  request during ten minutes of this was served correctly. But at the default
  the release then simply sits there: the deadline is reported and not acted
  on, so a replica set that will never work stays scheduled, holding a pod
  slot in a namespace with a ceiling, waiting for somebody to notice.

  "Withdrawn without anybody acting" is the property this platform claims, and
  a release that stalls until a human intervenes does not have it. So the
  deadline now aborts rather than only reporting.

  Two minutes rather than ten. The readiness probe here declares failure after
  about seventeen seconds — two seconds before the first check, then three
  checks five seconds apart. Ten minutes to react to something established in
  seventeen seconds is not caution, it is thirty-five times longer than the
  evidence takes to arrive. Two minutes leaves generous room for a legitimate
  slow start, including pulling an image onto a node that has never run it,
  and is the only thing here measured against the probe it is waiting on.
  */}}
  progressDeadlineSeconds: {{ .Values.canary.progressDeadlineSeconds }}
  progressDeadlineAbort: {{ .Values.canary.progressDeadlineAbort }}

  strategy:
    canary:
      {{- /*
      Two addresses, not one. The controller rewrites the selector of each of
      these to pin it to one replica set, so "stable" always means the version
      that was already trusted and "canary" always means the one being tried.
      The plain service alongside them deliberately selects both, because it
      exists to be scraped rather than to be routed to.
      */}}
      stableService: payments-api-stable
      canaryService: payments-api-canary

      {{- /*
      How the traffic is actually split, and the one part of this chart that
      depends on something outside the cluster's own API.

      The weights are expressed on the route object, in the vendor-neutral
      routing API, by an executable the controller downloads and runs as a
      child process. The controller has first-class support for the routing
      layer installed here, which would have avoided the extra dependency, and
      it was not chosen: it expresses the weighting in a type belonging to one
      router, and the weighting is the single piece of this platform most
      likely to be copied by somebody running a different one.
      */}}
      trafficRouting:
        plugins:
          argoproj-labs/gatewayAPI:
            httpRoute: payments-api
            namespace: {{ .Release.Namespace }}

      {{- /*
      The step schedule, and it is deliberately absent rather than empty.

      With no steps, a release is still a release — the controller builds the
      new version alongside the old one, moves the whole weight across, and
      retires the old one — but it never holds anywhere to be looked at. That
      is the ordinary case, and establishing that the ordinary case still
      works before adding anything to interrupt it is the only reason to spend
      a task on a configuration this plain.

      What goes here is the deliverable of this phase: how much traffic a
      version nobody has evidence about gets first, how long the measurement
      runs before it is believed, and what result abandons the release. Those
      numbers are chosen against this service rather than against whatever
      makes a release succeed, which is why nothing is guessed into this space
      in the meantime.
      */}}
      {{- with .Values.canary.steps }}
      steps:
{{ toYaml . | indent 8 }}
      {{- end }}

      {{- if .Values.canary.steps }}
      {{- /*
      The gate, running alongside the steps above rather than between them.

      Two shapes were available. One runs a measurement at a named point and
      blocks until it answers, which reads neatly and only looks at the
      service at the moments somebody chose. The other, used here, runs
      continuously from the first weight onward and can abandon the release at
      any moment in any step.

      Continuous was chosen because the thing being guarded against does not
      wait to be asked. A version that starts failing forty seconds into a
      three-minute step would, under the other shape, keep its traffic until
      the step ended and the next measurement was due. Nothing about a
      failure makes it arrive on a schedule.

      It begins at step one rather than step zero: there is no point measuring
      a candidate before any traffic has been pointed at it, and a measurement
      taken then would read an absent version as a failing one.
      */}}
      analysis:
        templates:
          - templateName: payments-api-release-gate
        startingStep: 1
        {{- /*
        The one thing the template cannot know: which replica set is the
        candidate. The controller fills this in when it starts a measurement,
        and every query in the template narrows to it.

        Without this the gate would measure the service rather than the
        release — including the version already running, which is serving the
        large majority of traffic and is known to be fine. A candidate failing
        every request it received would barely move a figure averaged over
        both, and the gate would pass it.
        */}}
        args:
          - name: canary-hash
            valueFrom:
              podTemplateHashValue: Latest
      {{- end }}

  template:
    metadata:
      labels:
        app.kubernetes.io/name: payments-api
        app.kubernetes.io/version: {{ .Values.version | quote }}
    spec:
      {{- /*
      Give the process time to finish what it is serving. The container stops
      accepting new work on the signal and drains; without this the grace
      period would expire and in-flight requests would be dropped on every
      release, which would show up later as a release-safety problem that is
      really an omission here.
      */}}
      terminationGracePeriodSeconds: 20

      securityContext:
        runAsNonRoot: true
        # Stated numerically here as well as in the image. runAsNonRoot can
        # only be enforced against a numeric id, so without this the cluster
        # depends on the image declaring one — and an image that declares a
        # user by name fails to start with an error about verification rather
        # than about the user.
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: payments-api
          image: "{{ .Values.image.repository }}@{{ required "an image digest is required: a tag would not pin the version" .Values.image.digest }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}

          env:
            - name: VERSION
              value: {{ .Values.version | quote }}
            - name: LISTEN_ADDR
              value: ":{{ .Values.service.targetPort }}"
            - name: FAIL_LIVENESS
              value: {{ .Values.failure.liveness | quote }}
            - name: FAIL_READINESS
              value: {{ .Values.failure.readiness | quote }}
            - name: READY_AFTER
              value: {{ .Values.readyAfterSeconds | quote }}

          {{- /*
          Two probes, two meanings, two consequences.

          Liveness failing gets the container killed and restarted. It should
          only fail when a restart is the thing that would help.

          Readiness failing gets this copy removed from the service while it
          keeps running. It should fail whenever the copy is alive but should
          not be sent work.

          Pointing both at the same endpoint is the common mistake, and it
          turns "this copy is busy" into "restart every copy".
          */}}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}

          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}

          resources:
{{ toYaml .Values.resources | indent 12 }}

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
