{{- /*
Cluster-scoped rather than namespaced, so that one store serves every
namespace instead of one per environment. That follows from the environment
boundary being a namespace in a shared cluster: a store per namespace would
imply an isolation the namespaces do not provide, and would be three copies of
the same thing.

There is no auth section, and its absence is the design rather than an
omission. The operator finds its credentials through the binding held in AWS
against its own service account. Naming a service account here would be the
other mechanism, and the operator refuses to mix the two.
*/}}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.name }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ required "the store must be told which region to read from" .Values.region }}
