{{- /*
One of these per secret the platform expects. Each is a request, not a value:
it names a secret in AWS and the Kubernetes secret it should turn into, and the
operator fills it in. Nothing here is sensitive, which is why it is committed.

The refresh interval is what makes a rotation in AWS arrive in the cluster
without anyone applying anything. An hour is a deliberate middle: short enough
that a rotated credential is picked up within a working session, long enough
that the account is not billed for a request per secret per minute.
*/}}
{{- $root := . }}
{{- range .Values.secrets }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}
  namespace: {{ required "every secret must name the namespace it belongs in" .namespace }}
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: {{ $root.Values.name }}
    kind: ClusterSecretStore

  target:
    name: {{ .name }}
    # Owner by default: the operator owns the secret it creates, so deleting
    # this request deletes the secret rather than leaving an orphan behind
    # holding a value.
    #
    # Merge is for the case where the secret already exists and belongs to
    # something else. The operator then writes only the keys named below and
    # leaves every other key in that secret untouched, which is what makes it
    # safe to put one value into a secret somebody else created. It requires
    # the secret to exist already and fails loudly if it does not.
    creationPolicy: {{ .creationPolicy | default "Owner" }}

  data:
  {{- range .data }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        # The prefix is prepended here rather than written into every entry,
        # so that the one place it has to match the operator's AWS permission
        # is the one place it is written.
        key: {{ printf "%s/%s" (required "a secret prefix is required" $root.Values.secretPrefix) .remoteKey }}
      {{- if .remoteProperty }}
        # A secret in AWS holding more than one field is stored as one JSON
        # document, and without naming a field the whole document arrives as
        # the value. Naming it here is what makes a Kubernetes secret key hold
        # a usable value rather than a blob the consumer has to parse.
        property: {{ .remoteProperty }}
      {{- end }}
  {{- end }}
{{- end }}
