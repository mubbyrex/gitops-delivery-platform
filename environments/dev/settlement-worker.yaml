# settlement-worker in dev.
#
# Note what is not here and will never be: a replica count. For the API a
# second copy is capacity. For this one a second copy is the hazard.

# Often, because dev is where the behaviour is being watched and a job that
# runs twice an hour is tedious to observe.
schedule: "*/5 * * * *"

version: "dev"

image:
  digest: sha256:eb5a53dac319193a80193e396fea29e5a43895414e1f7ee3c4e6e9e3872e10b7  # built from 667cbaf0baeb

# Shorter than the gap to the next run, so that normal operation does not
# constantly exercise the overlap path. Making a run outlast its schedule is
# done deliberately when demonstrating that overlap is refused.
run:
  forSeconds: 30
  itemCount: 30

failure:
  run: false
