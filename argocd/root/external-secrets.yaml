# The secrets operator.
#
# Wave zero. It has no dependency on the ingress controller alongside it, but
# the store definition in wave one depends on this: the store is an instance of
# a type this chart installs, and an instance cannot be created before its
# type. The same ordering problem as the routing definitions, solved the same
# way.
#
# How this reaches AWS is the part worth understanding and it is not visible
# here. The service account below carries no role annotation, because the
# binding is a record held in AWS naming this namespace and this service
# account. That is deliberate: the usual annotation contains the AWS account
# number, and this repository is public.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    # A literal, as everywhere. The operator's version and the chart's are kept
    # in step by the project itself, so this one string pins both.
    targetRevision: 2.13.0

    helm:
      values: |
        # The type definitions ship inside this chart rather than needing a
        # separate source, unlike the routing definitions. Stated rather than
        # left to the default, because whether a chart installs its own types
        # decides whether anything has to be sequenced around it.
        installCRDs: true

        serviceAccount:
          create: true
          # Set explicitly rather than left to the chart's naming template.
          # The AWS-side binding is keyed on this exact string, and a change
          # to a template in a future chart version would break the binding
          # without changing anything visible here.
          name: external-secrets

        # Three deployments come out of this chart: the operator, an admission
        # webhook, and a controller that issues the webhook's certificate. The
        # node pool has a hard ceiling of eleven pods per node, so these
        # numbers are not decoration.
        resources:
          requests:
            cpu: 25m
            memory: 96Mi
          limits:
            cpu: 200m
            memory: 192Mi

        webhook:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi

        certController:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The type definitions in this chart are large enough that applying them
      # the ordinary way exceeds the size limit on the annotation that records
      # what was last applied. Server-side apply has no such limit. Same
      # reasoning as the routing definitions, same fix.
      - ServerSideApply=true
