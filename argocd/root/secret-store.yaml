# Where secrets come from, and which ones the cluster expects to have.
#
# Wave one, after the operator in wave zero, because everything this chart
# renders is an instance of a type that chart installs.
#
# This is a local chart rather than an upstream one. Its contents are this
# platform's own decisions — which account to read from, which secrets exist —
# and there is no upstream version of that.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secret-store
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/mubbyrex/gitops-delivery-platform.git
    targetRevision: main
    path: charts/secret-store

    helm:
      # Not in environments/ because none of it is per-environment: there is
      # one cluster, one account, and one store serving every namespace. The
      # secrets listed below name their own namespace, which is the point at
      # which this would have to be split if the store ever became
      # per-environment.
      values: |
        region: us-east-1
        secretPrefix: kestrel-pay

        secrets:
          # The demonstration that the mechanism works end to end. The value
          # is placed in AWS by hand and never appears here — this file names
          # it and nothing more, which is the whole property being claimed.
          - name: demo-secret
            namespace: dev
            data:
              - secretKey: message
                remoteKey: dev/demo
                remoteProperty: message

          # The delivery controller's own admin password, and the first thing
          # here that is a real need rather than a demonstration. The
          # controller generates a password on first start and keeps it in a
          # secret of its own; because this platform is torn down between
          # working sessions, every resume is a first start, so that password
          # was different every time. This makes it stable without it ever
          # being committed.
          #
          # Merge, not Owner: the secret below is created by the controller's
          # own installation and holds its signing key and certificate
          # alongside the password. Owning it here would mean replacing those
          # too, which would log everyone out and break the serving
          # certificate. Only the two password keys are written.
          #
          # The value stored in AWS is a bcrypt hash, not the password. The
          # controller only ever compares against a hash, so the password
          # itself does not need to exist anywhere in this platform.
          - name: argocd-secret
            namespace: argocd
            creationPolicy: Merge
            data:
              - secretKey: admin.password
                remoteKey: platform/argocd-admin
                remoteProperty: passwordHash
              # Required alongside the hash. The controller treats any session
              # token issued before this moment as invalid, so a password
              # change takes effect by invalidating what came before it rather
              # than by waiting for sessions to expire.
              - secretKey: admin.passwordMtime
                remoteKey: platform/argocd-admin
                remoteProperty: passwordMtime

  destination:
    server: https://kubernetes.default.svc
    # The store is cluster-scoped and the secrets below each name their own
    # namespace, so this is only where the controller records the release.
    namespace: external-secrets

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
