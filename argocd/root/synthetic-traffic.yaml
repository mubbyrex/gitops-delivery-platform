# Generated requests, in dev only. The one component here that would not exist
# in a real deployment, listed alongside the rest rather than hidden, because a
# reader should meet that fact immediately. Why the traffic is generated at all,
# and why it goes through the front door instead of at the service, is in
# docs/decisions.md.
#
# Wave two, like the services. No ordering requirement against the service it
# sends to: a sender that starts first fails for a few seconds and counts the
# failures, which is what it does during a release anyway.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: synthetic-traffic
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  sources:
    - repoURL: https://github.com/mubbyrex/gitops-delivery-platform.git
      targetRevision: main
      path: charts/synthetic-traffic
      helm:
        valueFiles:
          - $values/environments/dev/synthetic-traffic.yaml

    - repoURL: https://github.com/mubbyrex/gitops-delivery-platform.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # Owned by the environment component, along with the quota that bounds
      # it. One pod of that quota is spent on this.
      - CreateNamespace=false
