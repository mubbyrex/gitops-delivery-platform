# One view per service: config maps the dashboard sidecar picks up.
#
# Wave two, which is when the sidecar from wave zero already exists. Released
# once rather than per environment -- shipping these per environment would
# produce the same view listed twice, not two views. Reasoning in
# docs/decisions.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: service-views
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/mubbyrex/gitops-delivery-platform.git
    # Tracks the branch rather than a fixed commit, which is how the delivery
    # controller is meant to work and is not the same thing as an unpinned
    # dependency. Charts and images from outside this repository are pinned
    # exactly; this repository's reference to itself is the mechanism.
    targetRevision: main
    path: charts/service-views

  destination:
    server: https://kubernetes.default.svc
    # Deployed where the collector lives, not where the services do. The views
    # describe both environments and belong to neither.
    namespace: metrics

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
